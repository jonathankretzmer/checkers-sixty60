name: ci

# Type-check, lint, build, prove the committed dist/ matches src/, and smoke the
# stdio MCP server. Actions are pinned to commit SHAs (comment = version);
# Dependabot's github-actions updater keeps them current.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun x tsc -p tsconfig.json --noEmit

      - name: Lint
        run: bun x biome lint src

      - name: Build
        run: bun run build

      - name: dist/ is in sync with src/
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is stale — run 'bun run build' and commit dist/"
            exit 1
          fi

      - name: stdio MCP smoke test
        run: |
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | SIXTY60_DATA_DIR="$(mktemp -d)" bun dist/mcp-server.js)
          echo "$out" | grep -q '"name":"request_otp"' \
            || { echo "::error::stdio MCP server did not list tools"; echo "$out"; exit 1; }
