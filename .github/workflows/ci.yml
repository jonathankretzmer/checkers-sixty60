name: ci

# Type-check, lint, build, prove the committed dist/ matches src/, and smoke the
# stdio MCP server. Actions are pinned to commit SHAs (comment = version);
# Dependabot's github-actions updater keeps them current.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Node runtime that the published CLI actually targets (package.json
      # engines: >=24). Used only for the runtime smoke below; build tooling
      # stays on bun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun x tsc -p tsconfig.json --noEmit

      - name: Lint
        run: bun x biome lint src

      - name: Build
        run: bun run build

      - name: dist/ is in sync with src/
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is stale — run 'bun run build' and commit dist/"
            exit 1
          fi

      - name: stdio MCP smoke test (Node 24 + bun)
        run: |
          probe() {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
              | SIXTY60_DATA_DIR="$(mktemp -d)" "$@" dist/mcp-server.js
          }
          for rt in "node" "bun"; do
            out=$(probe $rt)
            echo "$out" | grep -q '"name":"request_otp"' \
              || { echo "::error::stdio MCP smoke failed under $rt"; echo "$out"; exit 1; }
            echo "ok: $rt"
          done
